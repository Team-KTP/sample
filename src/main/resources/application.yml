spring:
  application:
    name: ttadak-sample
  datasource:
    url: jdbc:h2:mem:ttadak-sample;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ttadak: debug
    org.hibernate.SQL: debug
